name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          echo "Creating .env file from GitHub Secrets..."
          cat > .env << EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ secrets.APP_PORT }}
          APP_SECRET=${{ secrets.APP_SECRET }}
          API_KEY=${{ secrets.API_KEY }}
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          EOF
          echo ".env file created successfully"
          echo "Contents (masked):"
          sed 's/=.*/=***/' .env

      - name: Deploy with Docker Compose
        run: |
          echo "Starting application stack..."
          docker-compose down -v || true
          docker-compose up -d
          echo "Waiting for services to start..."
          sleep 30
          docker-compose ps

      - name: Verify containers are running
        run: |
          if docker-compose ps | grep -q "Up"; then
            echo "✓ All containers are running"
          else
            echo "✗ Some containers failed to start"
            docker-compose logs
            exit 1
          fi

      - name: Run application tests
        run: |
          set -e
          APP_URL="http://localhost:${{ secrets.APP_PORT }}"

          echo "1. Testing application and database connectivity..."
          if curl -f "$APP_URL/health"; then
            echo "✓ Web application is healthy"
          else
            echo "✗ Web application health check failed"
            exit 1
          fi

          if curl -sf "$APP_URL/api/data" > /dev/null; then
            echo "✓ Application database connection working"
          else
            echo "✗ Application database connection failed"
            exit 1
          fi

          echo "2. Testing data consistency..."
          DB_COUNT=$(docker-compose exec -T db \
            psql -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" \
            -t -c "SELECT COUNT(*) FROM items;" | tr -d ' \n' || echo "0")
          WEB_COUNT=$(curl -s "$APP_URL/api/items/count" | tr -d ' \n')

          echo "Database count: $DB_COUNT"
          echo "Web API count: $WEB_COUNT"

          if [ "$DB_COUNT" = "$WEB_COUNT" ]; then
            echo "✓ Data consistency test passed"
          else
            echo "✗ Data consistency test failed"
            exit 1
          fi

      - name: Collect logs and reports
        if: always()
        run: |
          mkdir -p artifacts
          docker-compose ps > artifacts/containers-status.txt || true
          docker-compose logs > artifacts/docker-compose.log || true
          cp .env artifacts/env-file.txt || true
          sed -i 's/=.*/=***/' artifacts/env-file.txt || true
          echo "TEST_RESULT=passed" > artifacts/test-report.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifacts-${{ github.run_id }}
          path: artifacts/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker-compose down -v || true
